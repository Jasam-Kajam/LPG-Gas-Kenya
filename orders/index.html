<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | GasHubKE</title><link rel="stylesheet" href="/assets/css/app.css"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand fw-bold" href="/">GasHub<span class="text-orange">KE</span></a></div></nav><main class="container py-5"><h2>My Orders</h2><div id="orders" class="mt-4"></div></main><script type="module">import {auth,db,collection,getDocs,query,where,orderBy,onAuthStateChanged} from "/assets/js/firebase.js";const el=document.querySelector("#orders");onAuthStateChanged(auth,async u=>{if(!u)return location.href="/auth/login.html?next=/orders/";try{const q=query(collection(db,"orders"),where("customerId","==",u.uid),orderBy("createdAt","desc"));const s=await getDocs(q);el.innerHTML=s.empty?'<div class="hero-card">No orders yet.</div>':s.docs.map(d=>{const x=d.data();return `<div class="hero-card mb-3"><div class="d-flex justify-content-between"><strong>Order ${d.id.slice(0,8)}</strong><span class="badge text-bg-light">${x.status}</span></div><p class="mb-1">${x.items.map(i=>`${i.name} × ${i.quantity}`).join(", ")}</p><b>KES ${Number(x.total).toLocaleString()}</b><div class="small text-muted">${x.county||""} · ${x.town||""}</div></div>`}).join("")}catch(e){el.textContent=e.message}});</script></body></html>
