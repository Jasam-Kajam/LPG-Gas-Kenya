<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | GasHubKE</title><link rel="stylesheet" href="/assets/css/app.css"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><nav class="navbar bg-white border-bottom"><div class="container"><a href="/" class="navbar-brand fw-bold">GasHub<span class="text-orange">KE</span></a></div></nav><main class="container py-5"><div class="row g-4"><div class="col-lg-7"><div class="hero-card"><h3>Checkout</h3><p class="text-muted">Suppliers handle delivery directly. Confirm your details and submit the order.</p><form id="checkout"><input id="phone" class="form-control mb-2" placeholder="Phone number" required><select id="county" class="form-select mb-2" required><option value="">County</option></select><input id="town" class="form-control mb-2" placeholder="Town/area" required><textarea id="address" class="form-control mb-3" placeholder="Delivery address / landmark" required></textarea><button class="btn btn-orange">Place order</button></form><div id="msg" class="mt-3"></div></div></div><div class="col-lg-5"><div class="hero-card"><h5>Order summary</h5><div id="summary"></div></div></div></div></main><script type="module">import {auth,db,collection,addDoc,serverTimestamp} from "/assets/js/firebase.js";import {COUNTIES} from "/assets/js/config.js";const cart=JSON.parse(localStorage.getItem("gashubke_cart")||"[]"),$=x=>document.querySelector(x);COUNTIES.forEach(x=>$("#county").insertAdjacentHTML("beforeend",`<option>${x}</option>`));$("#summary").innerHTML=cart.map(x=>`<div class="d-flex justify-content-between py-2 border-bottom"><span>${x.product.name} × ${x.quantity}</span><b>KES ${(x.product.price*x.quantity).toLocaleString()}</b></div>`).join("");$("#checkout").onsubmit=async e=>{e.preventDefault();if(!auth.currentUser)return location.href="/auth/login.html";try{const total=cart.reduce((a,x)=>a+x.product.price*x.quantity,0);await addDoc(collection(db,"orders"),{customerId:auth.currentUser.uid,customerEmail:auth.currentUser.email,items:cart.map(x=>({productId:x.id,name:x.product.name,price:x.product.price,quantity:x.quantity,supplierId:x.product.supplierId})),total,phone:$("#phone").value,county:$("#county").value,town:$("#town").value,address:$("#address").value,status:"pending",paymentStatus:"pending",createdAt:serverTimestamp()});localStorage.removeItem("gashubke_cart");location.href="/orders/"}catch(x){$("#msg").textContent=x.message}};</script></body></html>
