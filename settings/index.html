<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | GasHubKE</title><link rel="stylesheet" href="/assets/css/app.css"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-5"><a href="/">← Marketplace</a><div class="hero-card mt-3"><h3>Account settings</h3><div id="account">Loading...</div><button id="logout" class="btn btn-outline-danger mt-3">Sign out</button></div></main><script type="module">import {auth,onAuthStateChanged,signOut} from "/assets/js/firebase.js";const a=document.querySelector("#account");onAuthStateChanged(auth,u=>{if(!u)return location.href="/auth/login.html?next=/settings/";a.innerHTML=`<p><strong>Email:</strong> ${u.email}</p><p><strong>Name:</strong> ${u.displayName||"Not set"}</p><p><strong>User ID:</strong> <code>${u.uid}</code></p>`});document.querySelector("#logout").onclick=()=>signOut(auth).then(()=>location.href="/");</script></body></html>
