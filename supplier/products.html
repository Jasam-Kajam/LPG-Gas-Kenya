<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Listing | GasHubKE</title><link rel="stylesheet" href="/assets/css/app.css"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-5"><a href="/supplier/">← Dashboard</a><div class="hero-card mt-3"><h3>Add LPG listing</h3><form id="form" class="row g-2"><div class="col-md-6"><input id="name" class="form-control" placeholder="Listing name" required></div><div class="col-md-6"><select id="brand" class="form-select" required><option value="">Brand</option></select></div><div class="col-md-4"><select id="size" class="form-select" required><option>3kg</option><option>6kg</option><option>13kg</option><option>50kg</option></select></div><div class="col-md-4"><input id="price" type="number" min="1" max="1350" class="form-control" placeholder="Price (KES)" required></div><div class="col-md-4"><input id="county" class="form-control" placeholder="County" required></div><div class="col-12"><input id="town" class="form-control" placeholder="Town" required></div><div class="col-12"><button class="btn btn-orange">Publish listing</button></div></form><p id="msg" class="mt-3"></p></div></main><script type="module">import {auth,db,collection,addDoc,serverTimestamp} from "/assets/js/firebase.js";import {BRANDS} from "/assets/js/config.js";const $=x=>document.querySelector(x);BRANDS.forEach(x=>$("#brand").insertAdjacentHTML("beforeend",`<option>${x}</option>`));$("#form").onsubmit=async e=>{e.preventDefault();if(!auth.currentUser)return location.href="/auth/login.html";try{const p={name:$("#name").value,brand:$("#brand").value,size:$("#size").value,price:Number($("#price").value),county:$("#county").value,town:$("#town").value,supplierId:auth.currentUser.uid,supplierName:auth.currentUser.displayName||auth.currentUser.email,status:"active",createdAt:serverTimestamp()};if(p.price>1350)throw Error("Maximum refill price is KES 1,350.");await addDoc(collection(db,"products"),p);location.href="/supplier/"}catch(x){$("#msg").textContent=x.message}};</script></body></html>
