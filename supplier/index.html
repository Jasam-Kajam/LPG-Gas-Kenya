<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplier Dashboard | GasHubKE</title><link rel="stylesheet" href="/assets/css/app.css"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand fw-bold" href="/">GasHub<span class="text-orange">KE</span></a><span>Supplier Dashboard</span></div></nav><main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><span class="eyebrow">SUPPLIER</span><h2>Dashboard</h2></div><a class="btn btn-orange" href="/supplier/products.html">Add listing</a></div><div id="dashboard" class="row g-3"></div></main><script type="module">import {auth,db,collection,getDocs,query,where,onAuthStateChanged} from "/assets/js/firebase.js";const d=document.querySelector("#dashboard");onAuthStateChanged(auth,async u=>{if(!u)return location.href="/auth/login.html?next=/supplier/";const s=await getDocs(query(collection(db,"products"),where("supplierId","==",u.uid)));d.innerHTML=`<div class="col-md-4"><div class="hero-card"><h6>Listings</h6><h2>${s.size}</h2></div></div><div class="col-md-4"><div class="hero-card"><h6>Commission</h6><h2>KES 49</h2><p class="small text-muted">per cylinder</p></div></div><div class="col-md-4"><div class="hero-card"><h6>Status</h6><h2>Active</h2></div></div>`});</script></body></html>
