<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | GasHubKE</title><link rel="stylesheet" href="/assets/css/app.css"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="center-page"><main class="empty-card" style="width:min(440px,92vw)"><img src="/assets/images/favicon.svg" width="55"><h3 class="mt-3">Create account</h3><form id="form"><input id="name" class="form-control mb-2" placeholder="Full name" required><input id="email" type="email" class="form-control mb-2" placeholder="Email" required><input id="password" type="password" minlength="8" class="form-control mb-3" placeholder="Password (8+ characters)" required><button class="btn btn-orange w-100">Create account</button></form><p id="msg" class="small mt-3"></p><a href="/auth/login.html">Already have an account?</a></main><script type="module">import {register} from "/assets/js/auth.js";const $=x=>document.querySelector(x);$("#form").onsubmit=async e=>{e.preventDefault();try{await register({name:$("#name").value,email:$("#email").value,password:$("#password").value});location.href="/"}catch(x){$("#msg").textContent=x.message}};</script></body></html>
